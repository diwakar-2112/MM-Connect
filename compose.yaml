services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: 'parinay'
      POSTGRES_USER: 'parinay'
      POSTGRES_PASSWORD: 'localdev_password'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: 'cgr.dev/chainguard/minio:latest'
    environment:
      MINIO_ROOT_USER: 'local_minio_admin'
      MINIO_ROOT_PASSWORD: 'local_minio_password'
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: